name: build-x86_64

on:
  workflow_dispatch:        # manual build; automatic releases are handled by release.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      # musl = runs on any Linux (no glibc version problems on panel hosts)
      - name: Build
        run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/omnicore omnicore-linux-x86_64
          gzip -9 -k omnicore-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: omnicore-linux-x86_64
          path: omnicore-linux-x86_64.gz
